[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peekseed"
version = "0.1.0"
description = "Local-first AI research framework over your own documents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "peekseed contributors"}]
keywords = ["rag", "search", "pdf", "agent", "local-first"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "numpy>=1.24",
  "pydantic>=2.0",
  "pypdf>=4.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
pymupdf = ["pymupdf>=1.24"]

[project.scripts]
peekseed = "peekseed.__main__:main"

[tool.setuptools.packages.find]
include = ["peekseed*"]

[tool.setuptools.package-data]
peekseed = ["web/*"]
