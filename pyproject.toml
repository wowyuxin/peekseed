[build-system]
# PEP 639 support (SPDX license expression + license-files) landed in
# setuptools 77; keep the floor there so every build understands the metadata.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "peekseed"
version = "0.1.0rc4"
description = "Local-first AI research framework over your own documents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "peekseed contributors"}]
keywords = ["rag", "search", "pdf", "agent", "local-first"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "numpy>=1.24",
  "pydantic>=2.0",
  "pypdf>=4.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Core formats are stdlib + pypdf only; every extra below is opt-in and never
# imported at module load. See docs/formats.md for the license rationale.
office = ["python-docx>=1.1", "python-pptx>=0.6.23"]
tables = ["openpyxl>=3.1"]
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0"]
layout = ["pymupdf>=1.24"]
pymupdf = ["pymupdf>=1.24"]
test = ["pytest>=8.0"]

[project.urls]
# The public repository is the maintainer's personal GitHub account; these
# URLs must match the repository that publishes the package (see release.md).
Homepage = "https://github.com/wowyuxin/peekseed"
Repository = "https://github.com/wowyuxin/peekseed"
Issues = "https://github.com/wowyuxin/peekseed/issues"
Changelog = "https://github.com/wowyuxin/peekseed/blob/main/CHANGELOG.md"

[project.scripts]
peekseed = "peekseed.__main__:main"

[tool.setuptools.packages.find]
include = ["peekseed*"]

[tool.setuptools.package-data]
# The single-file web UI sits beside the Python package and must ship in both
# the wheel and the sdist; tests/test_packaging.py and CI assert this.
peekseed = ["web/*"]

[tool.ruff]
line-length = 88
target-version = "py311"
# Keep generated/vendored trees and runtime state out of the lint run.
extend-exclude = ["build", "dist", ".venv", "workspace", ".uv-cache"]

[tool.ruff.lint]
# Ruff's stable, low-noise defaults: real errors and suspicious code rather
# than a full style rewrite of the existing codebase.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing, tracked style debt in the 0.1.0 codebase (owned by other
# workstreams). Each entry names the exact codes already present, so new
# findings still fail CI. New files must pass unmodified.
"tests/*" = ["F401", "F841"]
"peekseed/__main__.py" = ["F401"]
"peekseed/agent.py" = ["F401", "E741"]
"peekseed/answer.py" = ["F401"]
"peekseed/app.py" = ["F401", "F841"]
"peekseed/extract.py" = ["E731"]
"peekseed/ingest/index.py" = ["F401", "F822", "F841"]
"peekseed/links.py" = ["F841", "E741"]
"peekseed/tools.py" = ["F841"]
