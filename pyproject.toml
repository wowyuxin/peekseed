[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peekseed"
version = "0.1.0rc1"
description = "Local-first AI research framework over your own documents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "peekseed contributors"}]
keywords = ["rag", "search", "pdf", "agent", "local-first"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "numpy>=1.24",
  "pydantic>=2.0",
  "pypdf>=4.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Core formats are stdlib + pypdf only; every extra below is opt-in and never
# imported at module load. See docs/formats.md for the license rationale.
office = ["python-docx>=1.1", "python-pptx>=0.6.23"]
tables = ["openpyxl>=3.1"]
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0"]
layout = ["pymupdf>=1.24"]
pymupdf = ["pymupdf>=1.24"]
test = ["pytest>=8.0"]

[project.scripts]
peekseed = "peekseed.__main__:main"

[tool.setuptools.packages.find]
include = ["peekseed*"]

[tool.setuptools.package-data]
peekseed = ["web/*"]
