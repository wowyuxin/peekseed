name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Read-only token: this workflow never writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Test (offline suite)
        run: python -m pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install "ruff==0.17.1"
      - name: Lint
        run: ruff check .

  licenses:
    name: dependency licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install default dependency closure
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Check licences (fail on AGPL/GPL)
        run: python scripts/check_licenses.py

  build:
    name: build, artifact checks, sdist smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel "setuptools>=77"
      - name: Build sdist and wheel
        run: python -m build
      - name: Assert artifact contents and console script
        run: |
          python - <<'PY'
          import glob
          import tarfile
          import zipfile

          wheels = sorted(glob.glob("dist/*.whl"))
          sdists = sorted(glob.glob("dist/*.tar.gz"))
          assert wheels, "no wheel was built"
          assert sdists, "no sdist was built"

          wheel = wheels[0]
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              assert any(n.endswith("peekseed/web/index.html") for n in names), (
                  "peekseed/web/index.html is missing from the wheel"
              )
              metadata = [n for n in names
                          if n.endswith(".dist-info/entry_points.txt")]
              assert metadata, "wheel metadata has no entry_points.txt"
              entry_points = archive.read(metadata[0]).decode("utf-8")
              assert "peekseed = peekseed.__main__:main" in entry_points, (
                  "console script entry point missing: %r" % entry_points
              )
          print("wheel ok:", wheel)

          sdist = sdists[0]
          with tarfile.open(sdist) as archive:
              names = archive.getnames()
          required = [
              "peekseed/web/index.html",
              "docs/api.md",
              "docs/install.md",
              "docs/deploy.md",
              "docs/local-models.md",
              "docs/release.md",
              "docs/security.md",
              "tests/test_packaging.py",
              "scripts/serve.sh",
              "scripts/check_licenses.py",
              "LICENSE",
              "README.md",
              "CHANGELOG.md",
              "pyproject.toml",
              "MANIFEST.in",
              "THIRD-PARTY-NOTICES.md",
              ".env.example",
          ]
          missing = [item for item in required
                     if not any(n == item or n.endswith("/" + item) for n in names)]
          assert not missing, "missing from sdist: %r" % missing
          print("sdist ok:", sdist)
          PY
      - name: Install the sdist in a scratch venv and smoke test
        run: |
          python -m venv "$RUNNER_TEMP/sdist-venv"
          PATH="$RUNNER_TEMP/sdist-venv/bin:$PATH" python -m pip install --upgrade pip
          PATH="$RUNNER_TEMP/sdist-venv/bin:$PATH" python -m pip install dist/*.tar.gz
          # Run from outside the checkout so imports and the console script use
          # the installed sdist, not the source tree.
          cd "$RUNNER_TEMP"
          PATH="$RUNNER_TEMP/sdist-venv/bin:$PATH" peekseed version
          PATH="$RUNNER_TEMP/sdist-venv/bin:$PATH" python - <<'PY'
          import pathlib
          import sys

          import peekseed

          assert peekseed.__version__ == "0.1.0rc4", peekseed.__version__
          module_path = pathlib.Path(peekseed.__file__).resolve()
          assert module_path.is_relative_to(pathlib.Path(sys.prefix).resolve()), (
              "smoke test imported the source tree instead of the sdist: %s"
              % module_path
          )
          ui = module_path.parent / "web" / "index.html"
          assert ui.is_file(), "web UI missing after sdist install: %s" % ui
          text = ui.read_text(encoding="utf-8")
          assert len(text) > 10_000, "web UI looks truncated (%d bytes)" % len(text)
          assert "<html" in text.lower()
          print("sdist smoke ok: %s (%d bytes)" % (ui, len(text)))
          PY
